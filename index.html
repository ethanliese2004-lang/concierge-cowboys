<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Concierge Cowboys | Shoot with Competence. Carry with Confidence.</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- Hidden form so Netlify's build bot detects it -->
    <form name="quote-request" netlify netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="quote-request" />
      <input name="bot-field" />
      <input name="first_name" />
      <input name="last_name" />
      <input name="email" />
      <input name="phone" />
      <input name="classes" />
      <input name="experience" />
      <input name="timeframe" />
      <textarea name="message"></textarea>
    </form>
  </body>
</html>
